<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب الوسام - للتقديم والمنح الجامعية</title>
    <style>
        :root {
            --primary-color: #004080;
            --secondary-color: #0066cc;
            --bg-color: #f4f7f6;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            background: white;
            margin: 30px auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 28px;
        }
        .header p {
            color: #666;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        input[type="text"], input[type="tel"], input[type="email"], select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--primary-color);
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        #loading {
            display: none;
            text-align: center;
            color: var(--primary-color);
            margin-top: 15px;
            font-weight: bold;
        }
        #success-msg {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>مكتب الوسام للخدمات الجامعية</h1>
        <p>بوابتك الرسمية للتقديم والقبول ومنح التعليم العالي</p>
    </div>

    <!-- استمارة تقديم الطالب -->
    <form id="applicationForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
            <label for="fullName">الاسم الرباعي للطالب:</label>
            <input type="text" id="fullName" name="fullName" required placeholder="أدخل اسمك كاملاً">
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف (واتساب):</label>
            <input type="tel" id="phone" name="phone" required placeholder="مثال: 00968xxxxxxxx">
        </div>

        <div class="form-group">
            <label for="highSchoolType">نوع الشهادة الثانوية:</label>
            <select id="highSchoolType" name="highSchoolType" required>
                <option value="">-- اختر نوع الشهادة --</option>
                <option value="الشهادة الثانوية العمانية">الشهادة الثانوية العمانية</option>
                <option value="الشهادة العربية">الشهادة العربية</option>
                <option value="شهادة أخرى">شهادة أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="desiredMajor">التخصص المرغوب:</label>
            <input type="text" id="desiredMajor" name="desiredMajor" required placeholder="مثال: الطب البشري، هندسة حاسوب...">
        </div>

        <div class="form-group">
            <label for="studentFile">رفع الشهادة الثانوية أو الأوراق المطلوبة (PDF أو صور):</label>
            <input type="file" id="studentFile" name="studentFile" required>
        </div>

        <button type="submit">إرسال الطلب الآن</button>
        <div id="loading">جاري إرسال طلبك وحفظ البيانات... ريثما يتم تحويلك...</div>
    </form>

    <div id="success-msg">
        تم إرسال طلبك بنجاح إلى مكتب الوسام! 🎉<br>
        سيتم التواصل معك عبر الواتساب قريباً لاستكمال إجراءات التقديم.
    </div>
</div>

<script>
    function handleFormSubmit(event) {
        event.preventDefault(); // منع إعادة تحميل الصفحة
        
        // إظهار رسالة التحميل
        document.getElementById('loading').style.display = 'block';
        
        setTimeout(function() {
            // إخفاء النموذج وإظهار رسالة النجاح
            document.getElementById('applicationForm').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }, 1500);
    }
</script>

</body>
</html>
